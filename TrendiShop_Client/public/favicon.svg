<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="TrendiShop">
  <defs>
    <linearGradient id="tsBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20232B"/>
      <stop offset="0.55" stop-color="#111318"/>
      <stop offset="1" stop-color="#0A0B0E"/>
    </linearGradient>
    <linearGradient id="tsSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Rich black squircle -->
  <rect width="48" height="48" rx="11" fill="url(#tsBg)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="10.5" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
  <rect width="48" height="48" rx="11" fill="url(#tsSheen)"/>
  <!-- T monogram: white crossbar + stem -->
  <rect x="12" y="13.5" width="24" height="6" rx="3" fill="#ffffff"/>
  <rect x="21" y="13.5" width="6" height="23" rx="3" fill="#ffffff"/>
  <!-- Brand-orange foot: the two-tone nod from the wordmark -->
  <rect x="21" y="29" width="6" height="7.5" rx="3" fill="#F15A24"/>
</svg>
